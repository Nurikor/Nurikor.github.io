            <button class="lang-btn" data-lang="en" type="button" aria-pressed="true">EN</button>

        </ul>

      <!-- PORTFOLIO -->
      <section class="portfolio" aria-labelledby="portfolio-heading">
        <h2 id="portfolio-heading" data-i18n="portfolio_title">Portfolio</h2>
        <p class="section-desc" data-i18n="portfolio_desc">List of projects and developments. Click on a project for details.</p>
        <div class="projects-container" id="projects-container">

      <!-- ABOUT ME -->
      <section class="about-me" aria-labelledby="about-heading">

        <div class="about-container" id="about-container">
        </div>
