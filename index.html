<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="Personal card of Nurikor, a frontend developer student. Links to projects and social media." />
  <title>Nurikor`s card</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icons: можно брать SVG-иконки брендов на Simple Icons — https://simpleicons.org/ -->
  <main class="card">
    <header class="hero">
      <div class="avatar-wrap">
        <img class="avatar" src="img/NRA672.png" alt="Avatar"/>
      </div>
      <div class="hero-text">
        <h1 id="name" data-i18n="name"></h1>
        <p id="role" data-i18n="role"></p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
        <button class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </header>

    <section class="main-links">
      <ul>
        <li>
          <a class="big-link" id="link-telegram" href="https://t.me/nurikor672" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 3.5L2.8 10.3c-.7.2-.7.7-.1.9l4.6 1.4 1.9 5.8c.2.7.6.8 1 .5l2.8-2 4.6 3.3c.8.5 1.4.2 1.6-.7L23.1 4.1c.2-.9-.5-1.6-1.6-1.6z"/></svg>
            <span data-i18n="link_telegram">Telegram</span>
          </a>
        </li>
        <li>
          <a class="big-link" id="link-github" href="https://github.com/nurikor" target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12.02c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.34-1.27-1.7-1.27-1.7-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.76 2.68 1.25 3.33.96.1-.75.4-1.25.72-1.54-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.18-3.1-.12-.29-.52-1.47.11-3.06 0 0 .96-.31 3.15 1.18a10.9 10.9 0 012.87-.39c.97 0 1.95.13 2.86.38 2.18-1.5 3.13-1.18 3.13-1.18.64 1.59.24 2.77.12 3.06.74.81 1.17 1.84 1.17 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.77 1.07.77 2.15 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A11.53 11.53 0 0023.5 12.02C23.5 5.73 18.27.5 12 .5z"/></svg>
            <span data-i18n="link_github">GitHub</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="portfolio">
      <h2 data-i18n="portfolio_title"></h2>
      <p data-i18n="portfolio_desc"></p>
      <div class="projects">
        <article class="project">
          <h3 data-i18n="project1_title">KindHub</h3>
          <p data-i18n="project1_desc"></p>
          <a href="https://nurikor.github.io/KindHub/" target="_blank" rel="noopener" data-i18n="project_link_text">View project</a>
        </article>
        <article class="project">
          <h3 data-i18n="project2_title">BilimTeam</h3>
          <p data-i18n="project2_desc"></p>
          <a href="https://github.com/Nurikor/CT-BilimTeam" target="_blank" rel="noopener" data-i18n="project_link_text">View project</a>
        </article>
      </div>
    </section>

    <section class="about-me">
      <details>
        <summary data-i18n="about_me_title">Обо мне</summary>
        <div class="about-content">
          <ul id="about-list" data-i18n="about_me_items"></ul>
        </div>
      </details>
    </section>

    <footer class="icon-footer">
      <!-- SVG иконки хранятся в папке img/ и стилизуются через CSS -->
      <ul>
        <li><a href="https://youtube.com/@nurikor" target="_blank" rel="noopener" aria-label="YouTube"><img src="img/youtube.svg" alt="YouTube" class="footer-icon"></a></li>
        <li><a href="https://tiktok.com/@nurikortt" target="_blank" rel="noopener" aria-label="TikTok"><img src="img/tiktok.svg" alt="TikTok" class="footer-icon"></a></li>
        <li><a href="https://github.com/nurikor" target="_blank" rel="noopener" aria-label="GitHub"><img src="img/github.svg" alt="GitHub" class="footer-icon"></a></li>
        <li><a href="mailto:c4726069@gmail.com" aria-label="Email"><img src="img/mail.svg" alt="Email" class="footer-icon"></a></li>
      </ul>
      <small data-i18n="footer_note"></small>
    </footer>

  </main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
